name: Feature request
description: Suggest an idea
title: "Feature Request: "
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Check the existing issues first to see if your request is already reported.
  - type: textarea
    attributes:
      label: Description
      description: What do you want, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Add any other context or screenshots.

        Tip: Click this area and drag in images or log files.
    validations:
      required: false
