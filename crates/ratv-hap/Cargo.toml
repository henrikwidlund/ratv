[package]
name = "ratv-hap"
description = "HAP pairing (SRP pair-setup, pair-verify) and session ciphers, sans-IO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Accessory (Apple TV) side of pairing. Used to build fake devices in tests.
accessory = []

[dependencies]
ratv-codec.workspace = true
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
hkdf = "0.13"
sha2 = "0.11"
num-bigint = "0.5"
rand_core = "0.10"
zeroize = "1"
thiserror = "2"

[dev-dependencies]
criterion.workspace = true
proptest = "1"

[[bench]]
name = "cipher"
harness = false

[lints]
workspace = true
