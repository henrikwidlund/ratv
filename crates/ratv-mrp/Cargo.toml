[package]
name = "ratv-mrp"
description = "Apple Media Remote Protocol (MRP) messages and player state, sans-IO"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ratv-codec.workspace = true
prost = { workspace = true, features = ["derive"] }
bytes.workspace = true
thiserror.workspace = true
rusty-opus = { version = "1.0.2", optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "mrp"
harness = false

[lints]
workspace = true

[features]
# Opus encoder for voice input from PCM.
opus = ["dep:rusty-opus"]
