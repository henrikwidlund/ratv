[workspace]
resolver = "3"
members = ["crates/*", "tools/proto-gen"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ratv-codec = { path = "crates/ratv-codec", version = "0.1.0" }
ratv-hap = { path = "crates/ratv-hap", version = "0.1.0" }
ratv-companion = { path = "crates/ratv-companion", version = "0.1.0" }
ratv-discovery = { path = "crates/ratv-discovery", version = "0.1.0" }
ratv-airplay = { path = "crates/ratv-airplay", version = "0.1.0" }
ratv-mrp = { path = "crates/ratv-mrp", version = "0.1.0" }
bytes = "1"
thiserror = "2"
proptest = "1"
prost = { version = "0.14", default-features = false, features = ["std"] }
rand_core = "0.10"
ed25519-dalek = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
# Conflicts with the `unreachable_pub` lint.
redundant_pub_crate = "allow"
# `mul_add` is slow on CPUs without FMA, for example ARMv7.
suboptimal_flops = "allow"
# Duplicates come from dependencies.
multiple_crate_versions = "allow"
# Reports guards that are already dropped at the end of their block.
significant_drop_tightening = "allow"
# Needs `repository`, which is not set yet.
cargo_common_metadata = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# `expect` is only used for invariants that cannot fail.
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = true
codegen-units = 1

# Size-optimized profile for embedded targets: `cargo build --profile embedded`.
[profile.embedded]
inherits = "release"
opt-level = "s"
strip = true
